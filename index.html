
<!DOCTYPE html>
<html>
<head>
    <title>SNA Lab Role Segmentation</title>

    <script>
        function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            const accounts = {
                "pc1": "dns123",
                "pc2": "web123",
                "pc3": "client123",
                "pc4": "monitor123"
            };

            if (accounts[user] === pass) {

                let role = "";
                let instruction = "";

                if (user === "pc1") {
                    role = "DNS Role";
                    instruction = "Edit hosts file, run ping/nslookup.";

                } else if (user === "pc2") {
                    role = "Web Server Role";
                    instruction = "Deploy site and verify uptime.";

                } else if (user === "pc3") {
                    role = "Client Role";
                    instruction = "Access site and run tracert.";

                } else if (user === "pc4") {
                    role = "Monitoring Role";
                    instruction = "Capture traffic with Wireshark or DevTools.";
                }

                document.body.innerHTML =
                    "<h1>" + role + "</h1>" +
                    "<p>" + instruction + "</p>" +

                    "<h2>Shared Files</h2>" +

                    "<ul>" +
                    "<li><a href='dns_instructions.txt' download>DNS Instructions</a></li>" +
                    "<li><a href='web_tasks.txt' download>Web Server Tasks</a></li>" +
                    "<li><a href='client_notes.txt' download>Client Notes</a></li>" +
                    "<li><a href='monitoring_logs.txt' download>Monitoring Logs</a></li>" +
                    "</ul>";

            } else {
                alert("Access Denied");
            }
        }
    </script>
</head>

<body>
    <h2>Restricted Access Login</h2>

    <label>
        Username:
        <input type="text" id="username">
    </label>

    <br><br>

    <label>
        Password:
        <input type="password" id="password">
    </label>

    <br><br>

    <button onclick="login()">Login</button>
</body>
</html>
